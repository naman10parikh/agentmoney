<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">agentmoney --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: agentmoney [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Track what your AI agents actually spend.</text>
<text x="24" y="146" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  -V, --version                       output the version number</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -h, --help                          display help for command</text>
<text x="24" y="226" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  proxy [options]                     Start a local proxy that intercepts and</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">                                      tracks API calls</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  calc [options]                      Calculate cost for a single API call</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  estimate [options]                  Estimate cost for a session (calls * avg</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                                      tokens)</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  models [options]                    List supported models and their pricing</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  demo                                Run a demo simulation to see how tracking</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                      works</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  usage [options]                     Fetch real usage from the Anthropic Usage</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                                      API (needs an Admin API key in</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                      ANTHROPIC_ADMIN_KEY)</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  memory-search [options] &lt;query...&gt;  Search the repo's knowledge corpus</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                                      (brain/, memory/, docs) with BM25</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  sandbox-run [options]               Price a call log inside an isolated E2B</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                                      sandbox (needs E2B_API_KEY)</text>
</svg>
